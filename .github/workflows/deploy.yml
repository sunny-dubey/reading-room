name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # also runnable by hand from the Actions tab
  schedule:
    - cron: '47 0,6,12,18 * * *'   # four editions a day: 06:17, 12:17, 18:17, 00:17 IST (odd minute = less queueing; GitHub may still start late)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache fetched articles (summaries)
        uses: actions/cache@v4
        with:
          path: .cache
          key: articles-${{ github.run_id }}
          restore-keys: articles-
      - run: npm run build 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API for the "On GitHub" section (higher rate limit than anonymous)
      - name: Fail if a content collection didn't load
        run: |
          # Astro logs a broken YAML collection as [ERROR] but still exits 0; don't publish a site missing the Canon.
          if grep -q '\[ERROR\]' build.log; then grep '\[ERROR\]' build.log; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows in public repos after 60 days without repository activity.
  # When the last commit is 45+ days old, commit a one-line date file so the daily edition keeps running.
  # (A push made with GITHUB_TOKEN doesn't trigger another workflow run, so this can't loop.)
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit if the repo has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $age days ago"
          if [ "$age" -lt 45 ]; then exit 0; fi
          date -u +%Y-%m-%d > .github/last-edition
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-edition
          git commit -m "Keep the daily edition schedule alive"
          git push

  # Alert: a failed build, deploy or keepalive opens a GitHub issue (GitHub emails you about it);
  # the next successful run closes it.
  alert:
    needs: [build, deploy, keepalive]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Edition build failed
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the alert issue
        if: contains(needs.*.result, 'failure')
        run: |
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          msg="The ${{ github.event_name }} run failed on $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"
          else gh issue create --title "$TITLE" --body "$msg

          Today's edition is not live; the site shows the previous one with the stale-edition notice. This issue closes itself on the next successful run."
          fi
      - name: Close the alert issue after a good run
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          for n in $(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Fixed: this run succeeded. $RUN_URL"
          done

  check-links:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true   # report dead Canon links without failing the deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:links
