# ---------- Postmortems: learn from failure ----------
- id: postmortem-culture
  track: postmortems
  title: "Postmortem Culture: Learning from Failure"
  author: Google SRE book
  url: https://sre.google/sre-book/postmortem-culture/
  kind: book
  minutes: 25
  why: How to read (and write) a postmortem so it teaches something.
- id: aws-s3-2017
  track: postmortems
  title: Summary of the Amazon S3 Service Disruption (Feb 2017)
  author: AWS
  url: https://aws.amazon.com/message/41926/
  kind: article
  minutes: 10
  why: One mistyped command, a subsystem that hadn't restarted in years, and half the internet down.
- id: gitlab-2017
  track: postmortems
  title: Postmortem of database outage of January 31
  author: GitLab
  url: https://about.gitlab.com/blog/2017/02/10/postmortem-of-database-outage-of-january-31/
  kind: article
  minutes: 25
  why: Accidental deletion plus five backup methods that didn't work. A lesson in testing restores.
- id: cloudflare-2019
  track: postmortems
  title: Details of the Cloudflare outage on July 2, 2019
  author: Cloudflare
  url: https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/
  kind: article
  minutes: 30
  why: A single regex that took CPU to 100% worldwide, and a great explanation of regex backtracking.
- id: slack-2021
  track: postmortems
  title: Slack's Outage on January 4th, 2021
  author: Slack Engineering
  url: https://slack.engineering/slacks-outage-on-january-4th-2021/
  kind: article
  minutes: 20
  why: Autoscaling, cold caches and network saturation compounding on the first workday of the year.
- id: facebook-2021
  track: postmortems
  title: More details about the October 4 outage
  author: Meta Engineering
  url: https://engineering.fb.com/2021/10/05/networking-traffic/outage-details/
  kind: article
  minutes: 15
  why: BGP and DNS explained through the outage that locked Facebook out of its own buildings.
- id: danluu-postmortems
  track: postmortems
  title: A collection of postmortems
  author: Dan Luu
  url: https://github.com/danluu/post-mortems
  kind: docs
  minutes: 60
  why: Hundreds more, grouped by cause. Pick one a week.
