# The Canon: foundational reads per track, in suggested order.
# Progress is tracked in your browser. Edit freely: add, remove, reorder.
# track: research | systems | backend | ai-eng | ml | security | hft | quant | macro | math | postmortems
# kind: paper | article | book | video | course | docs
# minutes: rough reading/watching time
# parts: chapters (or sittings) of a long work, in reading order. Today's plan and the Canon
#        point at the next unfinished part instead of the whole book. url is optional.

# ---------- Distributed Systems & Databases ----------
- id: young-bloods
  track: systems
  title: Notes on Distributed Systems for Young Bloods
  author: Jeff Hodges
  url: https://www.somethingsimilar.com/2013/01/14/notes-on-distributed-systems-for-young-bloods/
  kind: article
  minutes: 20
  why: The mindset shift. Why failure is the normal case and what that does to every design decision.
- id: patterns-distributed
  track: systems
  title: Patterns of Distributed Systems
  author: Unmesh Joshi
  url: https://martinfowler.com/articles/patterns-of-distributed-systems/
  kind: article
  minutes: 90
  why: Named building blocks (write-ahead log, leader and followers, quorum, high-water mark) you'll see everywhere.
- id: lamport-clocks
  track: systems
  title: Time, Clocks, and the Ordering of Events in a Distributed System
  author: Leslie Lamport
  url: https://lamport.azurewebsites.net/pubs/time-clocks.pdf
  kind: paper
  minutes: 45
  why: Why "what happened first?" is hard without a global clock, and logical clocks as the answer.
- id: raft-visual
  track: systems
  title: The Secret Lives of Data, Raft visualised
  author: Ben Johnson
  url: https://thesecretlivesofdata.com/raft/
  kind: course
  minutes: 15
  why: See consensus happen step by step before reading the paper.
- id: raft
  track: systems
  title: In Search of an Understandable Consensus Algorithm (Raft)
  author: Ongaro & Ousterhout
  url: https://raft.github.io/raft.pdf
  kind: paper
  minutes: 60
  why: How replicated systems agree on one log. The basis of etcd, Consul, CockroachDB.
- id: dynamo
  track: systems
  title: "'Dynamo: Amazon''s Highly Available Key-value Store'"
  author: DeCandia et al.
  url: https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf
  kind: paper
  minutes: 60
  why: Consistent hashing, vector clocks, sloppy quorums. The availability-first design behind Cassandra and DynamoDB.
- id: cp-or-ap
  track: systems
  title: Please stop calling databases CP or AP
  author: Martin Kleppmann
  url: https://martin.kleppmann.com/2015/05/11/please-stop-calling-databases-cp-or-ap.html
  kind: article
  minutes: 20
