# Status pages behind the Outage map (/outages/). Fetched at build time, once per published edition.
# format: statuspage (Atlassian Statuspage history.atom: timestamped updates) | gcp (Google Cloud feed) | aws (AWS RSS)
# kind:   cloud | edge | devtools | ai | comms
# where:  optional default location when the provider only runs in one place (leave empty for global services)
- { id: aws, name: AWS, url: 'https://status.aws.amazon.com/rss/all.rss', format: aws, kind: cloud }
- { id: gcp, name: Google Cloud, url: 'https://status.cloud.google.com/en/feed.atom', format: gcp, kind: cloud }
- { id: digitalocean, name: DigitalOcean, url: 'https://status.digitalocean.com/history.atom', format: statuspage, kind: cloud }
- { id: linode, name: Akamai Cloud (Linode), url: 'https://status.linode.com/history.atom', format: statuspage, kind: cloud }
- { id: fly, name: Fly.io, url: 'https://status.flyio.net/history.atom', format: statuspage, kind: cloud }
- { id: cloudflare, name: Cloudflare, url: 'https://www.cloudflarestatus.com/history.atom', format: statuspage, kind: edge }
- { id: vercel, name: Vercel, url: 'https://www.vercel-status.com/history.atom', format: statuspage, kind: edge }
- { id: netlify, name: Netlify, url: 'https://www.netlifystatus.com/history.atom', format: statuspage, kind: edge }
- { id: github, name: GitHub, url: 'https://www.githubstatus.com/history.atom', format: statuspage, kind: devtools }
- { id: bitbucket, name: Bitbucket, url: 'https://bitbucket.status.atlassian.com/history.atom', format: statuspage, kind: devtools }
- { id: npm, name: npm, url: 'https://status.npmjs.org/history.atom', format: statuspage, kind: devtools }
- { id: supabase, name: Supabase, url: 'https://status.supabase.com/history.atom', format: statuspage, kind: devtools }
- { id: datadog, name: Datadog, url: 'https://status.datadoghq.com/history.atom', format: statuspage, kind: devtools }
- { id: openai, name: OpenAI, url: 'https://status.openai.com/history.atom', format: statuspage, kind: ai }
- { id: anthropic, name: Anthropic, url: 'https://status.anthropic.com/history.atom', format: statuspage, kind: ai }
- { id: discord, name: Discord, url: 'https://discordstatus.com/history.atom', format: statuspage, kind: comms }
- { id: zoom, name: Zoom, url: 'https://status.zoom.us/history.atom', format: statuspage, kind: comms }
- { id: twilio, name: Twilio, url: 'https://status.twilio.com/history.atom', format: statuspage, kind: comms }
