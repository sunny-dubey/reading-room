# The Roadmap: what you want to learn, area by area.
# Areas 1-25 are your system design roadmap; 26-31 cover AI engineering, ML foundations, payments, mathematics,
# testing & correctness, and engineering craft & judgment; 32 is the cybersecurity engineer roadmap; 33 is quantitative finance.
# Every article is matched to its closest topics by meaning (embeddings, at build time) and cards show
# "Why read: you'll get better at <topic> (<area>). <why>". Topic ids are used for progress, so keep them
# stable; a topic that appears in several areas shares one id.
#
# area:  id, n (order), title, track (colour), why (used when a topic has no why of its own)
# topic: id, name, optional group (sub-heading), optional why, optional about (extra words for matching)
