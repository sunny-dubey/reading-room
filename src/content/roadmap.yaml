# The Roadmap: what you want to learn, area by area.
# Areas 1-25 are your system design roadmap; 26-29 cover AI engineering, ML foundations, payments and mathematics.
# Every article is matched to its closest topics by meaning (embeddings, at build time) and cards show
# "Why read: you'll get better at <topic> (<area>). <why>". Topic ids are used for progress, so keep them
# stable; a topic that appears in several areas shares one id.
