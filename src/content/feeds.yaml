# Sources for The Reading Room. Fetched at build time, once per published edition.
# Every article is summarised at build time (extractive, no AI model) and given a "worth" score,
# so announcements and news sink and deep explanations rise.
#
# category (labels/order in src/lib/feeds.ts):
#   systems      Distributed Systems & Databases
#   backend      Scalability & Architecture (page: /architecture/)
#   ai-eng       AI Engineering & Agents
#   ml           ML & LLM Foundations
#   security     Security: web, crypto, cloud, detection, exploitation
#   math         Mathematics
#   postmortems  Postmortems: learning from failure
#   pulse        Pulse: a small page of the week's headlines (not on the front page)
# limit: max items kept from this feed · maxAgeDays: ignore older items
# weight: ranking nudge, -2..2 (default 0). Raise authors known for depth, lower newsletters and roundups.

