# "Numbers you should know": a daily flash card on Today. Guess, then reveal.
# Counted as right within `tolerance`× either way (default 2). Cards you miss come back sooner.
# Every number is derived (the arithmetic is in `how`) or comes from the named source.
- { id: mem-ref, q: "Main memory (DRAM) reference", answer: 100, unit: ns, how: "About 100 ns, and roughly unchanged for 20 years.", source: "Jeff Dean, Latency numbers every programmer should know" }
- { id: l1-ref, q: "L1 cache reference", answer: 1, unit: ns, tolerance: 3, how: "About 1 ns, a few CPU cycles. Memory is around 100× slower.", source: "Jeff Dean, Latency numbers every programmer should know" }
- { id: disk-seek, q: "Hard disk seek", answer: 10, unit: ms, how: "About 10 ms, the arm physically moves. That's 100,000× a memory reference.", source: "Jeff Dean, Latency numbers every programmer should know" }
- { id: dc-rtt, q: "Round trip inside one datacentre", answer: 0.5, unit: ms, tolerance: 3, how: "About 500 µs. Within a rack it can be well under 100 µs.", source: "Jeff Dean, Latency numbers every programmer should know" }
- { id: ca-nl-rtt, q: "Round trip California → Netherlands → California", answer: 150, unit: ms, how: "About 150 ms. Distance, not bandwidth, sets this.", source: "Jeff Dean, Latency numbers every programmer should know" }
- { id: fibre-speed, q: "Speed of light in optical fibre", answer: 200000, unit: km/s, tolerance: 1.3, how: "About 200,000 km/s, two-thirds of c (glass has a refractive index of about 1.47). Use it to estimate any round trip.", source: "Physics: c / 1.47" }
- { id: equator-fibre, q: "Time for light in fibre to go once around the equator", answer: 200, unit: ms, tolerance: 1.5, how: "40,075 km / 200,000 km/s ≈ 200 ms. No global round trip can beat about 130 ms.", source: "Derived" }
- { id: mumbai-va, q: "Minimum round trip Mumbai ↔ N. Virginia (≈13,000 km of fibre)", answer: 130, unit: ms, tolerance: 1.5, how: "2 × 13,000 / 200,000 = 130 ms, before any processing.", source: "Derived" }
- { id: gbps-bytes, q: "Maximum throughput of a 1 Gbps link", answer: 125, unit: MB/s, tolerance: 1.5, how: "1,000 Mbit / 8 = 125 MB/s, a bit less after protocol overhead.", source: "Derived" }
- { id: sata-max, q: "Maximum throughput of a SATA III SSD", answer: 600, unit: MB/s, tolerance: 1.5, how: "6 Gbit/s with 8b/10b encoding = 600 MB/s; real drives reach about 550. NVMe gets past this limit.", source: "SATA III specification" }
- { id: seconds-day, q: "Seconds in a day", answer: 86400, unit: s, tolerance: 1.2, how: "24 × 3,600. Round it to 100,000 for quick per-second estimates.", source: "Derived" }
- { id: seconds-year, q: "Seconds in a year", answer: 31557600, unit: s, tolerance: 1.3, how: "About 31.5 million, roughly π × 10⁷.", source: "Derived" }
- { id: nines-3, q: "Downtime per year allowed at 99.9% availability", answer: 8.77, unit: hours, tolerance: 1.5, how: "0.1% of 8,766 hours ≈ 8.8 hours a year, or about 43 minutes a month.", source: "Derived" }
- { id: nines-4, q: "Downtime per year allowed at 99.99% availability", answer: 52.6, unit: minutes, tolerance: 1.5, how: "0.01% of a year ≈ 52.6 minutes. Each extra nine is 10× less.", source: "Derived" }
- { id: nines-5, q: "Downtime per year allowed at 99.999% availability", answer: 5.26, unit: minutes, tolerance: 1.5, how: "About 5 minutes a year, shorter than most deploys. Five nines needs automation, not people.", source: "Derived" }
- { id: pow-10, q: "2¹⁰", answer: 1024, unit: "", tolerance: 1.1, how: "1,024, about a thousand. So 2²⁰ ≈ a million and 2³⁰ ≈ a billion.", source: "Derived" }
- { id: pow-32, q: "2³² (all IPv4 addresses, all uint32 values)", answer: 4294967296, unit: "", tolerance: 1.3, how: "About 4.3 billion, fewer than there are people with phones. Hence NAT and IPv6.", source: "Derived" }
- { id: int32-max, q: "Largest 32-bit signed integer", answer: 2147483647, unit: "", tolerance: 1.3, how: "2³¹ − 1 ≈ 2.1 billion. Auto-increment IDs and Unix timestamps (in 2038) hit it.", source: "Derived" }
- { id: pow-64, q: "2⁶⁴", answer: 1.8e19, unit: "", tolerance: 2, how: "About 1.8 × 10¹⁹. A counter incrementing a billion times a second takes 585 years to wrap.", source: "Derived" }
- { id: uuid-bytes, q: "Size of a UUID", answer: 16, unit: bytes, tolerance: 1.2, how: "128 bits = 16 bytes (36 characters as text, so store it as binary).", source: "RFC 9562" }
- { id: eth-mtu, q: "Standard Ethernet MTU", answer: 1500, unit: bytes, tolerance: 1.2, how: "1,500 bytes, so a TCP segment carries 1,460 bytes of data after the IP and TCP headers.", source: "IEEE 802.3" }
- { id: initcwnd, q: "Data a new TCP connection can send in its first round trip", answer: 14.6, unit: KB, tolerance: 1.5, how: "Initial window of 10 segments × 1,460 bytes ≈ 14.6 KB. That's why small critical HTML loads fast.", source: "RFC 6928" }
- { id: tls13-rtt, q: "Round trips for a full TLS 1.3 handshake", answer: 1, unit: RTT, tolerance: 1.1, how: "One round trip (TLS 1.2 needed two), plus one more for TCP before it.", source: "RFC 8446" }
- { id: dns-udp, q: "Classic maximum DNS response over UDP (without EDNS)", answer: 512, unit: bytes, tolerance: 1.2, how: "512 bytes. Larger answers need EDNS or fall back to TCP.", source: "RFC 1035" }
- { id: linux-page, q: "Default memory page size on x86-64 Linux", answer: 4, unit: KB, tolerance: 1.2, how: "4 KB, with 2 MB and 1 GB huge pages for big memory workloads.", source: "x86-64 architecture" }
- { id: pg-page, q: "PostgreSQL page (block) size", answer: 8, unit: KB, tolerance: 1.2, how: "8 KB. Rows, indexes and I/O all work in these pages.", source: "PostgreSQL docs" }
- { id: pg-maxconn, q: "PostgreSQL default max_connections", answer: 100, unit: connections, tolerance: 1.2, how: "100. Each connection is a process using megabytes of memory, which is why poolers exist.", source: "PostgreSQL docs" }
- { id: dynamo-item, q: "Maximum DynamoDB item size", answer: 400, unit: KB, tolerance: 1.3, how: "400 KB. Bigger blobs go in S3 with a pointer in the item.", source: "AWS DynamoDB docs" }
- { id: s3-object, q: "Maximum size of a single S3 object", answer: 5, unit: TB, tolerance: 1.2, how: "5 TB, uploaded in parts. A single PUT is limited to 5 GB.", source: "AWS S3 docs" }
- { id: lambda-timeout, q: "Maximum AWS Lambda run time", answer: 15, unit: minutes, tolerance: 1.2, how: "15 minutes. Longer jobs need a queue and workers, or Step Functions.", source: "AWS Lambda docs" }
- { id: kafka-msg, q: "Kafka's default maximum message size", answer: 1, unit: MB, tolerance: 1.3, how: "About 1 MB (message.max.bytes). Large payloads go to object storage, with a reference in the message.", source: "Apache Kafka docs" }
- { id: frame-1080, q: "One uncompressed 1080p RGB frame", answer: 6.2, unit: MB, tolerance: 1.5, how: "1,920 × 1,080 × 3 bytes ≈ 6.2 MB, about 190 MB/s at 30 fps raw. Codecs shrink that about 100×.", source: "Derived" }
- { id: netflix-4k, q: "Bandwidth Netflix recommends for 4K streaming", answer: 15, unit: Mbps, tolerance: 1.5, how: "15 Mbps (5 for HD). Multiply by concurrent viewers for CDN capacity.", source: "Netflix Help Center" }
- { id: instant, q: "Response time that feels instant to a user", answer: 100, unit: ms, tolerance: 1.5, how: "About 100 ms; around 1 s keeps flow, and 10 s loses attention.", source: "Jakob Nielsen, response time limits" }
- { id: model-7b, q: "Memory for the weights of a 7B-parameter model in 16-bit", answer: 14, unit: GB, tolerance: 1.3, how: "7 × 10⁹ × 2 bytes = 14 GB, before the KV cache and activations.", source: "Derived" }
- { id: model-70b-int4, q: "Memory for the weights of a 70B model quantised to 4 bits", answer: 35, unit: GB, tolerance: 1.3, how: "70 × 10⁹ × 0.5 bytes = 35 GB, so it fits on one 48 GB GPU.", source: "Derived" }
- { id: tokens-chars, q: "Characters per token for English text (typical tokenizer)", answer: 4, unit: chars, tolerance: 1.5, how: "About 4 characters, or ¾ of a word. A 100k-token context is about 75,000 words.", source: "OpenAI tokenizer guidance" }
- { id: birthday, q: "People needed for a 50% chance two share a birthday", answer: 23, unit: people, tolerance: 1.3, how: "23. Collisions arrive around √N, the same maths behind hash and ID collisions.", source: "Derived" }
- { id: littles-pool, q: "Requests in flight at 1,000 req/s and 50 ms average latency", answer: 50, unit: requests, tolerance: 1.3, how: "Little's Law, L = λW = 1,000 × 0.05 = 50. Size pools from this.", source: "Derived (Little's Law)" }
- { id: utilisation-90, q: "Queueing delay at 90% utilisation, as a multiple of service time (M/M/1)", answer: 9, unit: "×", tolerance: 1.5, how: "Waiting time is ρ / (1 − ρ) × service time = 0.9 / 0.1 = 9×. At 50% it's only 1×.", source: "Derived (M/M/1 queue)" }
